# Place this file at: .github/workflows/android-apk.yml
name: Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only to attach the APK to a GitHub Release on tags

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The project has no gradlew, so install Gradle 8.9 (the minimum for AGP 8.7.2).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # GitHub's ubuntu runners ship with the Android SDK (ANDROID_HOME), so no
      # setup action is needed. (android-actions/setup-android@v3 fails because
      # it tries to install the removed "tools" package.)
      # The app compiles hev-socks5-tunnel natively with ndk-build (cloned by Gradle via git).
      - name: Install SDK platform, build-tools and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"

      # Optional repository secrets for a persistent signing key:
      #   SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD,
      #   SIGNING_KEY_PASSWORD, SIGNING_KEY_ALIAS
      # If they are missing, a temporary key is generated for this build.
      - name: Configure APK signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "Using persistent signing key from secrets"
            echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
            echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          else
            echo "No signing secrets found - generating a temporary key"
            keytool -genkeypair -v -keystore release-keystore.jks \
              -storepass temporary-ci-password -keypass temporary-ci-password \
              -alias aethervpn-ci -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=AetherVPN CI, OU=Build, O=AetherVPN, L=Unknown, ST=Unknown, C=US"
            echo "SIGNING_STORE_PASSWORD=temporary-ci-password" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=temporary-ci-password" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=aethervpn-ci" >> "$GITHUB_ENV"
          fi

      - name: Build signed release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Name APK
        run: |
          NAME="${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/release/app-release.apk "AetherVPN-${NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherVPN-release-apk
          path: AetherVPN-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AetherVPN-*.apk
