name: Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build installable release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;26.1.10909125"

      - name: Configure APK signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
            echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore release-keystore.jks -storepass temporary-ci-password \
              -alias aethervpn-ci -keypass temporary-ci-password -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=AetherVPN CI, OU=Build, O=AetherVPN, L=Unknown, ST=Unknown, C=US"
            echo "SIGNING_STORE_PASSWORD=temporary-ci-password" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=temporary-ci-password" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=aethervpn-ci" >> "$GITHUB_ENV"
          fi

      - name: Build signed release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Name APK
        run: cp app/build/outputs/apk/release/app-release.apk "AetherVPN-${GITHUB_REF_NAME//\//-}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherVPN-release-apk
          path: AetherVPN-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AetherVPN-*.apk
